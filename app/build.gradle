plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.android.bbkcalculator"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.android.bbkcalculator"
        minSdk = 32
        targetSdk = 37
        versionCode = 32
        versionName = "16.0.1.0"

        ndk {
            abiFilters = ['arm64-v8a']
        }
    }

    signingConfigs {
        create('keystore') {
            storeFile = file('keystore.jks')
            storePassword = 'dirtyfrag'
            keyAlias = 'dirtyfrag'
            keyPassword = 'dirtyfrag'
        }
    }

    buildTypes {
        debug {}
        release {
            signingConfig = signingConfigs.getByName('keystore')
            isMinifyEnabled = true
            isShrinkResources = true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    androidComponents {
        onVariants { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set("dirtyfrag.apk")
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs += [
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi",
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }

    lint {
        checkReleaseBuilds = false
    }

    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1,LICENSE,NOTICE,LICENSE.txt,NOTICE.txt}"
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.runtime
    implementation libs.compose.foundation
    implementation libs.compose.animation

    implementation platform(libs.miuix.bom)
    implementation libs.miuix.ui
    implementation libs.miuix.icons
    implementation libs.miuix.nav
    implementation libs.miuix.preference
    implementation libs.miuix.blur

    implementation libs.kotlinx.coroutines.android
    implementation libs.hiddenapibypass
    implementation libs.materialkolor
}
