name: Build DirtyFrag

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          set -e
          echo "=== 仓库根目录 ==="
          ls -la

          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "❌ 仓库根目录未找到 zip"
            exit 1
          fi
          echo "找到 zip: $ZIP"

          mkdir -p _extract
          unzip -q "$ZIP" -d _extract

          echo "=== 解压后结构（前 40 项）==="
          find _extract -maxdepth 6 | head -40

          # 用 settings.gradle.kts 定位项目根（这个文件只有项目根有）
          SRC=$(find _extract -maxdepth 6 -type f -name "settings.gradle.kts" -exec dirname {} \; | head -1)

          if [ -z "$SRC" ]; then
            echo "❌ 未找到 settings.gradle.kts，zip 结构可能不对"
            exit 1
          fi
          echo "项目根: $SRC"

          shopt -s dotglob
          mv "$SRC"/* .
          shopt -u dotglob
          rm -rf _extract

          echo "=== 搬运后仓库根 ==="
          ls -la
          echo "=== app/ 检查 ==="
          if [ ! -d "app" ]; then
            echo "❌ app/ 不存在，zip 结构不对"
            exit 1
          fi
          echo "✅ app/ 存在"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.1'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -alias dirtyfrag \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dirtyfrag -keypass dirtyfrag \
            -dname "CN=DirtyFrag, OU=Personal, O=Personal, L=CN, ST=CN, C=CN"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DirtyFrag-APK
          path: app/build/outputs/apk/release/dirtyfrag.apk
          retention-days: 30
