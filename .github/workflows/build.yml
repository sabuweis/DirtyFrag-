name: Build DirtyFrag

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "仓库根目录未找到 zip"
            exit 1
          fi
          echo "找到 zip: $ZIP"
          mkdir -p _extract
          unzip -q "$ZIP" -d _extract
          SRC=$(find _extract -maxdepth 6 -type f -name "settings.gradle.kts" -exec dirname {} \; | head -1)
          if [ -z "$SRC" ]; then
            echo "zip 里未找到 settings.gradle.kts"
            exit 1
          fi
          echo "项目根: $SRC"
          rm -rf "$SRC/.github"
          rm -rf "$SRC/.gitignore"
          shopt -s dotglob
          mv "$SRC"/* .
          shopt -u dotglob
          rm -rf _extract
          ls -la
          [ -d "app" ] || { echo "app/ 不存在"; exit 1; }

      - name: Patch CMakeLists (splicehelper output -> build dir)
        run: |
          set -e
          F=app/src/main/jni/CMakeLists.txt
          echo "=== 原始 CMakeLists ==="
          cat "$F"

          # 1) splicehelper 输出从源码目录改到构建目录
          sed -i 's|set(SPLICEHELPER "\${JNI_DIR}/splicehelper")|set(SPLICEHELPER "${CMAKE_CURRENT_BINARY_DIR}/splicehelper")|' "$F"

          # 2) 汇编器搜索路径加构建目录（防止 .incbin 找不到）
          sed -i 's|-I\${JNI_DIR}")|-I${JNI_DIR} -I${CMAKE_CURRENT_BINARY_DIR}")|' "$F"

          # 3) 删掉未定义的 ${C_FLAGS}（如果有）
          sed -i 's| \${C_FLAGS} ||g' "$F"

          echo "=== 修改后 CMakeLists ==="
          cat "$F"
          grep -q 'CMAKE_CURRENT_BINARY_DIR}/splicehelper' "$F" || { echo "patch 失败"; exit 1; }

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.1'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -alias dirtyfrag \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dirtyfrag -keypass dirtyfrag \
            -dname "CN=DirtyFrag, OU=Personal, O=Personal, L=CN, ST=CN, C=CN"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DirtyFrag-APK
          path: app/build/outputs/apk/release/dirtyfrag.apk
          retention-days: 30
